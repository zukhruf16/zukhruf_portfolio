<!doctype html>
<html lang="en" class="dark" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1a" />

    <!-- Primary Meta Tags -->
    <title>Zukhruf Toufeeq — Full-Stack & AI Developer</title>
    <meta name="title" content="Zukhruf Toufeeq — Full-Stack & AI Developer" />
    <meta
      name="description"
      content="Portfolio of Zukhruf Toufeeq, a Computer Science undergraduate and full-stack developer specializing in FastAPI, React.js, Python, and AI-powered applications with LLMs, LangChain, and RAG."
    />
    <meta
      name="keywords"
      content="Zukhruf Toufeeq, Full-Stack Developer, AI Developer, FastAPI, React.js, Python, LangChain, RAG, LLM, Backend Engineer, Portfolio"
    />
    <meta name="author" content="Zukhruf Toufeeq" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zukhruf Toufeeq — Full-Stack & AI Developer" />
    <meta
      property="og:description"
      content="Computer Science undergraduate building scalable web apps & AI-powered solutions with FastAPI, React, Python and modern LLM tooling."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Zukhruf Toufeeq — Full-Stack & AI Developer" />
    <meta
      property="twitter:description"
      content="Computer Science undergraduate building scalable web apps & AI-powered solutions."
    />

    <!-- Faster paint: dark bg before JS/CSS arrive -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0a0f1a;
        color: #e8edf7;
      }
    </style>

    <!-- Google Fonts — fewer weights, non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
